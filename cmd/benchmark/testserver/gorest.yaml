generate:
  output:
    models: "test/generated/models"
    resources: "test/generated/resources"
    dtos: "test/generated/dtos"
    openapi: "test/generated/openapi"
    config: "test/generated/config"
  auth:
    enabled: true
    endpoints:
      list: true
      get: true
      create: true
      update: true
      delete: true

server:
  port: 3001
  environment: "test"

database:
  url: "${DATABASE_URL}"

pagination:
  default_limit: 50
  max_limit: 10000

# Plugin system configuration (unified)
plugins:
  - name: requestid
    enabled: true
  - name: logger
    enabled: false
  - name: health
    enabled: true
  - name: cors
    enabled: true
    config:
      origins: "*"
  - name: ratelimit
    enabled: false
    config:
      requests_per_second: 10000
      burst: 20000
  - name: security
    enabled: true
  - name: contenttype
    enabled: true
  - name: auth
    enabled: true
    config:
      jwt_secret: "${JWT_SECRET}"
      jwt_ttl: 3600
