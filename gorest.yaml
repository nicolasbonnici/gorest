codegen:
  output:
    models: "test/generated/models"
    resources: "test/generated/resources"
    dtos: "test/generated/dtos"
    openapi: "test/generated/openapi"
    config: "test/generated/config"
  auth:
    enabled: false

server:
  port: 3001
  environment: "test"
  cors_origins: "*"
  ratelimit_enabled: false
  ratelimit_requests_per_second: 100
  ratelimit_burst: 200
  compression_enabled: true  # Enable gzip/deflate/brotli compression (default: true)
  compression_level: 2       # 1=best speed, 2=balanced (default), 3=best compression

database:
  url: "${DATABASE_URL}"

pagination:
  default_limit: 50
  max_limit: 10000
  # exact | estimate | none - see CONFIGURATION.md
  count: exact

plugins: []
