codegen:
  output:
    models: "test/generated/models"
    resources: "test/generated/resources"
    dtos: "test/generated/dtos"
    openapi: "test/generated/openapi"
    config: "test/generated/config"
  auth:
    enabled: false
    defaults:
      GET: false
      POST: false
      PUT: false
      DELETE: false
    endpoints:
      - name: users
        GET: false
        POST: false
        PUT: false
        DELETE: false
      - name: todo
        GET: false
        POST: false
        PUT: false
        DELETE: false

server:
  port: 3001
  environment: "test"

database:
  url: "${DATABASE_URL}"

pagination:
  default_limit: 50
  max_limit: 10000

plugins:
  - name: requestid
    enabled: true
  - name: logger
    enabled: true
  - name: ratelimit
    enabled: true
    config:
      requests_per_second: 100
      burst: 200
  - name: cors
    enabled: true
    config:
      origins: "*"
  - name: security
    enabled: true
  - name: contenttype
    enabled: true
  - name: auth
    enabled: false
    config:
      jwt_secret: "${JWT_SECRET}"
      jwt_ttl: 3600
