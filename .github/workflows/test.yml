name: Test

on:
  push:
    branches: [ "trunk" ]
    paths-ignore: [ '**.md', 'docs/**', 'LICENSE' ]
  pull_request:
    branches: [ "trunk" ]
    paths-ignore: [ '**.md', 'docs/**', 'LICENSE' ]

# A second push to the same branch cancels the run it superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=golang-version depName=go
  GO_VERSION: '1.26.5'
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: 'v2.12.2'

jobs:

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # Uses the toolchain directly, so it costs nothing to install and it
      # covers test files, which .golangci.yml excludes.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' | grep -v 'generated/' || true)
          if [ -n "$unformatted" ]; then
            echo "The following files need formatting:"
            echo "$unformatted"
            echo "Run 'make lint-fix' to fix formatting"
            exit 1
          fi

      # golangci-lint bundles staticcheck, errcheck, ineffassign, misspell,
      # gocyclo and govet, all enabled in .golangci.yml. Running them separately
      # meant compiling six tools from source on every run to duplicate work the
      # linter already does. The action caches a pinned binary instead.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    needs: quality
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Create test environment file
        run: |
          cat > test/.env.test << EOF
          DATABASE_URL=postgres://postgres:postgres@localhost:5433/mydb_test?sslmode=disable
          JWT_SECRET=test-secret-key-minimum-32-characters-long-for-jwt-testing
          EOF

      - name: Start databases and wait for health checks
        run: docker compose -f test/compose.yml up -d --wait db_test mysql_test

      - name: Load database schemas
        run: make test-schema

      - name: Test with coverage
        run: make test-coverage

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/coverage.out
          retention-days: 30
