name: Test

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:

  lint:
    name: Check lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.1'

      - name: Run go vet (excluding benchmark testserver)
        run: |
          # Get all packages except the benchmark testserver which requires generated code
          packages=$(go list ./... 2>/dev/null | grep -v '/plugins/benchmark/testserver' || true)
          if [ -n "$packages" ]; then
            go vet $packages
          fi

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' | grep -v 'generated/')
          if [ -n "$unformatted" ]; then
            echo "The following files need formatting:"
            echo "$unformatted"
            echo "Run 'make lint-fix' to fix formatting"
            exit 1
          fi

  test:
    needs: lint
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.1'

      - name: Create test environment file
        run: |
          cat > test/.env.test << EOF
          DATABASE_URL=postgres://postgres:postgres@localhost:5433/mydb_test?sslmode=disable
          JWT_SECRET=test-secret-key-minimum-32-characters-long-for-jwt-testing
          EOF

      - name: Start databases and wait for health checks
        run: docker compose -f test/compose.yml up -d --wait db_test mysql_test

      - name: Load database schemas
        run: make test-schema

      - name: Test with coverage
        run: make test-coverage

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/coverage.out
          retention-days: 30