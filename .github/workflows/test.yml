name: Test

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:

  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.0'

      - name: Install quality tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/gordonklaus/ineffassign@latest
          go install github.com/client9/misspell/cmd/misspell@latest
          go install github.com/kisielk/errcheck@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' | grep -v 'generated/' || true)
          if [ -n "$unformatted" ]; then
            echo "The following files need formatting:"
            echo "$unformatted"
            echo "Run 'make lint-fix' to fix formatting"
            exit 1
          fi

      - name: Run go vet (excluding benchmark testserver)
        run: |
          # Get all packages except the benchmark testserver which requires generated code
          packages=$(go list ./... 2>/dev/null | grep -v '/plugins/benchmark/testserver' || true)
          if [ -n "$packages" ]; then
            go vet $packages
          fi

      - name: Run staticcheck
        run: |
          packages=$(go list ./... 2>/dev/null | grep -v '/plugins/benchmark/testserver' || true)
          if [ -n "$packages" ]; then
            staticcheck $packages
          fi

      - name: Run ineffassign
        run: ineffassign ./...

      - name: Run misspell
        run: misspell -error .

      - name: Run errcheck
        run: |
          packages=$(go list ./... 2>/dev/null | grep -v '/plugins/benchmark/testserver' || true)
          if [ -n "$packages" ]; then
            errcheck -exclude .errcheck-excludes -ignoretests $packages
          fi

      - name: Run gocyclo (threshold 45)
        run: |
          gocyclo_output=$(gocyclo -over 45 . | grep -v 'vendor/' | grep -v 'generated/' | grep -v '_test.go' || true)
          if [ -n "$gocyclo_output" ]; then
            echo "Functions with cyclomatic complexity > 45:"
            echo "$gocyclo_output"
            exit 1
          fi

      - name: Run golangci-lint
        run: |
          echo "Running golangci-lint comprehensive checks..."
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run

      - name: Cleanup
        if: always()
        run: go clean -cache -testcache -modcache

  test:
    needs: quality
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.0'

      - name: Create test environment file
        run: |
          cat > test/.env.test << EOF
          DATABASE_URL=postgres://postgres:postgres@localhost:5433/mydb_test?sslmode=disable
          JWT_SECRET=test-secret-key-minimum-32-characters-long-for-jwt-testing
          EOF

      - name: Start databases and wait for health checks
        run: docker compose -f test/compose.yml up -d --wait db_test mysql_test

      - name: Load database schemas
        run: make test-schema

      - name: Test with coverage
        run: make test-coverage

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/coverage.out
          retention-days: 30