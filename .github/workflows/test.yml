name: Test

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.1'

      - name: Create test environment file
        run: |
          cat > .env.test << EOF
          DATABASE_URL=postgres://postgres:postgres@localhost:5433/mydb_test?sslmode=disable
          JWT_SECRET=test-secret-key
          PORT=3000
          EOF

      - name: Start databases
        run: docker compose -f compose.yml -f compose.override.test.yml up -d db_test mysql_test

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if docker exec gorest_db_test pg_isready -U postgres > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Attempt $i/30: PostgreSQL not ready yet..."
            sleep 2
          done
          docker exec gorest_db_test pg_isready -U postgres

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL..."
          for i in {1..30}; do
            if docker exec gorest_mysql_test mysqladmin ping -h localhost -utestuser -ptestpass > /dev/null 2>&1; then
              echo "MySQL is ready!"
              break
            fi
            echo "Attempt $i/30: MySQL not ready yet..."
            sleep 2
          done
          docker exec gorest_mysql_test mysqladmin ping -h localhost -utestuser -ptestpass

      - name: Load database schemas
        run: make test-schema

      - name: Generate code
        run: make test-generate

      - name: Build
        run: make build

      - name: Test with coverage
        run: make test-coverage

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/coverage.out
          retention-days: 30