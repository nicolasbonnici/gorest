name: Test

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.1'

      - name: Create test environment file
        run: |
          cat > test/.env.test << EOF
          DATABASE_URL=postgres://postgres:postgres@localhost:5433/mydb_test?sslmode=disable
          JWT_SECRET=test-secret-key-minimum-32-characters-long-for-jwt-testing
          EOF

      - name: Start databases and wait for health checks
        run: docker compose -f compose.yml -f compose.override.test.yml up -d --wait db_test mysql_test

      - name: Load database schemas
        run: make test-schema

      - name: Generate code
        run: make test-generate

      - name: Build
        run: make build

      - name: Test with coverage
        run: make test-coverage

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/coverage.out
          retention-days: 30