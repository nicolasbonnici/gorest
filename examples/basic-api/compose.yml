services:
  db:
    image: postgres:18
    container_name: example_api_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      # Build context is project root to support go.mod replace directive for local development
      # For production, publish GoREST module and remove the replace directive from go.mod
      context: ../..
      dockerfile: examples/basic-api/Dockerfile
    container_name: example_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-postgres}@db:5432/mydb?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-minimum-32-characters-long}
    ports:
      - "3000:3000"

volumes:
  db_data:
