generate:
  output:
    models: "generated/models"
    resources: "generated/resources"
    dtos: "generated/dtos"
    openapi: "generated/openapi"
    config: "generated/config"
  auth:
    enabled: true
    endpoints:
      list: true
      get: true
      create: true
      update: true
      delete: true

server:
  port: 3000
  environment: "development"

database:
  url: "${DATABASE_URL}"

pagination:
  default_limit: 10
  max_limit: 1000

# Plugin system configuration (unified)
plugins:
  - name: requestid
    enabled: true
  - name: logger
    enabled: true
  - name: ratelimit
    enabled: true
    config:
      requests_per_second: 100
      burst: 200
  - name: cors
    enabled: true
    config:
      origins: "*"
  - name: security
    enabled: true
  - name: contenttype
    enabled: true
  # Custom dummy plugin example
  - name: dummy
    enabled: true
    config:
      message: "Custom plugin is working!"
  - name: auth
    enabled: true
    config:
      jwt_secret: "${JWT_SECRET}"
      jwt_ttl: 900
