codegen:
  output:
    models: "generated/models"
    resources: "generated/resources"
    dtos: "generated/dtos"
    openapi: "generated/openapi"
    config: "generated/config"
  auth:
    enabled: true
  endpoints:
    - name: users
      auth:
        GET: false      # Public read
        POST: true      # Protected create
        PUT: true       # Protected update
        DELETE: true    # Protected delete
    - name: todos
      auth:
        GET: true       # Protected read
        POST: true      # Protected create
        PUT: true       # Protected update
        DELETE: true    # Protected delete

server:
  port: 3000
  environment: "development"

database:
  url: "${DATABASE_URL}"

pagination:
  default_limit: 10
  max_limit: 1000

# Top-level auth defaults (applied to all endpoints unless overridden)
# Secure by default - all methods require auth unless explicitly set to false
auth_defaults:
  GET: true
  POST: true
  PUT: true
  DELETE: true

# Plugin system configuration (unified)
plugins:
  - name: requestid
    enabled: true
  - name: logger
    enabled: true
  - name: ratelimit
    enabled: true
    config:
      requests_per_second: 200
      burst: 400
  - name: cors
    enabled: true
    config:
      origins: "http://localhost:3000"
  - name: security
    enabled: true
  - name: contenttype
    enabled: true
  - name: health
    enabled: true
  - name: openapi
    enabled: true
  # Custom dummy plugin example
  - name: dummy
    enabled: true
    config:
      message: "Custom plugin is working!"
  - name: auth
    enabled: true
    config:
      jwt_secret: "${JWT_SECRET}"
      jwt_ttl: 900
