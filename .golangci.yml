version: "2"
run:
  tests: true
linters:
  enable:
    - gocyclo
    - misspell
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (database/sql.DB).Close
        - encoding/json.Unmarshal
        - (github.com/nicolasbonnici/gorest/database.Database).Close
        - (github.com/nicolasbonnici/gorest/database.Rows).Close
        - (github.com/nicolasbonnici/gorest/database.Tx).Rollback
        - (*github.com/nicolasbonnici/gorest/migrations.MigrationLock).Release
        - (*github.com/nicolasbonnici/gorest/migrations.MigrationTracker).RecordFailedMigration
    gocyclo:
      min-complexity: 45
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
      - linters:
          - errcheck
        path: test/
      - linters:
          - errcheck
        path: internal/testhelpers/
    paths:
      - .*_test\.go$
      - vendor
      - generated
      - test/generated
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - .*_test\.go$
      - vendor
      - generated
      - test/generated
      - third_party$
      - builtin$
      - examples$
