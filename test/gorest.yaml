generate:
  output:
    models: "test/generated/models"
    resources: "test/generated/resources"
    dtos: "test/generated/dtos"
    openapi: "test/generated/openapi"
    config: "test/generated/config"
  auth:
    enabled: false
    endpoints:
      list: false
      get: false
      create: false
      update: false
      delete: false

server:
  port: 3000
  environment: "test"

database:
  url: "${DATABASE_URL}"

pagination:
  default_limit: 10
  max_limit: 1000

# Plugin system configuration (unified)
plugins:
  - name: requestid
    enabled: true
  - name: logger
    enabled: true
  - name: ratelimit
    enabled: false
    config:
      requests_per_second: 100
      burst: 200
  - name: cors
    enabled: true
    config:
      origins: "*"
  - name: security
    enabled: true
  - name: contenttype
    enabled: true
  - name: auth
    enabled: false
    config:
      jwt_secret: "${JWT_SECRET}"
      jwt_ttl: 900
