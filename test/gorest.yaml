codegen:
  output:
    models: test/generated/models
    resources: test/generated/resources
    dtos: test/generated/dtos
    openapi: test/generated/openapi
    config: test/generated/config
  auth:
    enabled: false
    defaults:
      GET: false
      POST: false
      PUT: false
      DELETE: false
    endpoints:
    - name: users
      GET: false
      POST: false
      PUT: false
      DELETE: false
    - name: todo
      GET: false
      POST: false
      PUT: false
      DELETE: false
server:
  port: 3000
  environment: test
  cors_origins: '*'
database:
  url: ${DATABASE_URL}
pagination:
  default_limit: 10
  max_limit: 1000
plugins:
- name: ratelimit
  enabled: false
  config:
    requests_per_second: 100
    burst: 200
- name: contenttype
  enabled: true
- name: health
  enabled: true
- name: auth
  enabled: false
  config:
    jwt_secret: ${JWT_SECRET}
    jwt_ttl: 900
