generate:
  output:
    models: "test/generated/models"
    resources: "test/generated/resources"
    dtos: "test/generated/dtos"
    openapi: "test/generated/openapi"
    config: "test/generated/config"
  auth:
    enabled: false
    endpoints:
      list: false
      get: false
      create: false
      update: false
      delete: false

server:
  port: 3000
  environment: "test"

database:
  url: "${DATABASE_URL}"

auth:
  jwt:
    secret: "${JWT_SECRET}"
    ttl: 900

pagination:
  default_limit: 10
  max_limit: 1000

cors:
  origins: "*"

rate_limit:
  enabled: false
  requests_per_second: 100
  burst: 200
