services:
  db:
    image: postgres:18
    container_name: gorest_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: gorest_api
    restart: always
    depends_on:
      - db
    environment:
      PORT: ${PORT:-3000}
      DB_URL: postgres://postgres:${DB_PASSWORD:-postgres}@db:5432/mydb?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:3000"

volumes:
  db_data:
